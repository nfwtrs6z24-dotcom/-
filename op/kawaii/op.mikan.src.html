<title>八西ニュース OP Kawaii</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a 16:9 picture-book screen with a candy transport row. Deliberately one pastel look. */
@font-face{font-family:"Pop";src:url(data:font/woff2;base64,__POP__) format("woff2")}
@font-face{font-family:"Maru";font-weight:700;src:url(data:font/woff2;base64,__MARU__) format("woff2")}
@font-face{font-family:"Fred";font-weight:600;src:url(data:font/woff2;base64,__FRED__) format("woff2")}
:root{
  --bg:#fff4f8; --ink:#5a4a7a; --muted:#8f82a8; --pink:#ff6fa3; --mint:#3cc8b4; --line:#f3d3e2;
  --ui:"Maru","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif; --fred:"Fred","Maru",sans-serif;
  color-scheme:light;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.screen{width:100%;max-width:100%;aspect-ratio:16/9;background:#bfe8ff;border:6px solid #fff;border-radius:28px;box-shadow:0 10px 0 var(--line);overflow:hidden}
canvas{display:block;width:100%;height:100%}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px}
button{font:700 16px var(--ui);color:#fff;background:var(--pink);border:0;border-radius:999px;padding:11px 22px;cursor:pointer;box-shadow:0 4px 0 #e0508a}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #e0508a}
button.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line)}
button:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.tc{font:600 14px var(--fred);color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.spec{font-size:13px;color:var(--muted);line-height:1.7;margin:0}
</style>
<div class="wrap">
  <div class="screen"><canvas id="cv" width="1920" height="1080"></canvas></div>
  <div class="bar">
    <button id="play">▶ 再生（音あり）</button>
    <button id="replay" class="ghost">最初から</button>
    <span class="tc" id="tc">00:00:00;00</span>
  </div>
  <p class="spec">10秒・1920×1080・29.97fps。1.2秒でみかんが登場、2.0秒「八」、2.5秒「西」、3.0秒「ニュース」、8.0秒でジャーン。</p>
</div>
<audio id="au" preload="auto" src="data:audio/mp4;base64,__AUDIO__"></audio>
<script>
const W=1920,H=1080,DUR=10;
const cv=document.getElementById('cv'),c=cv.getContext('2d');
const K={sky1:'#a9defc',sky2:'#e9f8ff',ink:'#5a4a7a',brown:'#8a4b2a',mikan:'#ff9a3d',mikan2:'#ff7f1f',leaf:'#5fc46a',pink:'#ff6fa3',blush:'#ff9fc0',
  sea1:'#7fd3f2',sea2:'#56bde8',sea3:'#3aa7dc',hill:'#8fdc8a',hill2:'#6cc875',white:'#ffffff'};
const LET=[{ch:'八',col:'#ff8a3d',t:2.0},{ch:'西',col:'#ff6fa3',t:2.5},{ch:'ニ',col:'#33c4b0',t:3.0},{ch:'ュ',col:'#55a8ff',t:3.125},{ch:'ー',col:'#ffbf2e',t:3.25},{ch:'ス',col:'#a27bff',t:3.375}];
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), lerp=(a,b,x)=>a+(b-a)*x, seg=(t,a,b)=>cl((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3), eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const elastic=x=>x<=0?0:x>=1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*2*Math.PI/3)+1;
const hash=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};
const TS=200, TY=440;
let LX=null;
function layout(){c.font=`${TS}px Pop`;const ws=LET.map(l=>c.measureText(l.ch).width*1.02);const tot=ws.reduce((a,b)=>a+b,0);let x=W/2-tot/2;LX=ws.map(w=>{const v=x+w/2;x+=w;return v})}
function beatPulse(t){if(t<2)return 0;const bt=(t-2)%.5;return Math.exp(-bt*10)}

// ---------- background
function sky(t){
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,K.sky1);g.addColorStop(1,K.sky2);c.fillStyle=g;c.fillRect(0,0,W,H);
  // drifting polka dots
  c.fillStyle='rgba(255,255,255,.38)';const s=120,o=(t*30)%s;
  for(let y=-s;y<H+s;y+=s)for(let x=-s;x<W+s;x+=s){const odd=((y/s)|0)%2;c.beginPath();c.arc(x+o+(odd?s/2:0),y+o,12,0,Math.PI*2);c.fill()}
}
function cloud(x,y,s){c.save();c.translate(x,y);c.scale(s,s);c.fillStyle='#fff';
  [[0,0,60],[55,-25,50],[105,0,58],[50,15,55]].forEach(([a,b,r])=>{c.beginPath();c.arc(a,b,r,0,Math.PI*2);c.fill()});c.restore()}
function clouds(t){
  cloud(((t*40)%2400)-300,170,1.1);cloud(((t*28+1100)%2400)-300,110,.8);cloud(((t*34+1700)%2400)-300,260,.65);
}
function hills(t){
  // mikan terraces on the hillside, like the slopes around Yawatahama
  c.save();c.fillStyle=K.hill;c.beginPath();c.moveTo(-50,H);c.quadraticCurveTo(260,330,700,H);c.fill();
  c.strokeStyle=K.hill2;c.lineWidth=6;c.lineCap='round';
  for(let k=0;k<5;k++){c.beginPath();const y=740+k*50,hw=150+k*55;c.moveTo(300-hw,y+30);c.quadraticCurveTo(300,y-30,300+hw,y+30);c.stroke()}
  for(let i=0;i<22;i++){const x=60+hash(i)*500,y=720+hash(i+7)*200; if(y<700+Math.abs(x-320)*.9)continue;
    const b=Math.sin(t*4+i)*2;c.fillStyle='#4fb35e';c.beginPath();c.arc(x,y+b,20,0,Math.PI*2);c.fill();
    c.fillStyle=K.mikan;c.beginPath();c.arc(x-6,y+b+4,7,0,Math.PI*2);c.arc(x+8,y+b-2,6,0,Math.PI*2);c.fill()}
  c.restore();
}
function sea(t){
  const layers=[[K.sea1,880,18,1.2],[K.sea2,940,16,-1.6],[K.sea3,1000,14,2]];
  layers.forEach(([col,y,a,sp],k)=>{
    c.fillStyle=col;c.beginPath();c.moveTo(0,H);
    for(let x=0;x<=W;x+=10)c.lineTo(x,y+Math.sin(x*.012+t*sp+k)*a);
    c.lineTo(W,H);c.closePath();c.fill();
    c.fillStyle='rgba(255,255,255,.8)';
    for(let x=((t*sp*40)%120+120)%120-120;x<W;x+=120){const yy=y+Math.sin((x+30)*.012+t*sp+k)*a;c.beginPath();c.arc(x+30,yy+2,7,0,Math.PI*2);c.fill()}
  });
}
function fish(t,t0,x0,col){
  const p=seg(t,t0,t0+.9); if(p<=0||p>=1)return;
  const x=x0+p*260,y=940-Math.sin(p*Math.PI)*260,rot=lerp(-.9,.9,p);
  c.save();c.translate(x,y);c.rotate(rot);c.fillStyle=col;
  c.beginPath();c.ellipse(0,0,46,28,0,0,Math.PI*2);c.fill();
  c.beginPath();c.moveTo(-36,0);c.lineTo(-70,-24);c.lineTo(-70,24);c.closePath();c.fill();
  c.fillStyle='#fff';c.beginPath();c.arc(22,-6,8,0,Math.PI*2);c.fill();c.fillStyle=K.ink;c.beginPath();c.arc(24,-6,4,0,Math.PI*2);c.fill();
  c.restore();
  if(p>.85||p<.15){const q=p<.15?p/.15:(1-p)/.15;c.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<5;i++){c.beginPath();c.arc(x+(i-2)*18,935-q*30*hash(i+t0),6,0,Math.PI*2);c.fill()}}
}

// ---------- decorations
function star4(x,y,r,col){c.fillStyle=col;c.beginPath();c.moveTo(x,y-r);c.quadraticCurveTo(x,y,x+r,y);c.quadraticCurveTo(x,y,x,y+r);c.quadraticCurveTo(x,y,x-r,y);c.quadraticCurveTo(x,y,x,y-r);c.fill()}
function sparkles(t){
  for(let i=0;i<26;i++){const x=hash(i)*W,y=hash(i+3)*640,ph=(t*1.3+hash(i+5)*3)%3;const s=Math.max(0,Math.sin(ph/3*Math.PI*2));
    if(s>0)star4(x,y,8+22*s*hash(i+9),i%3?'#fff':'#ffe27a')}
}
function heart(x,y,s,col){c.save();c.translate(x,y);c.scale(s,s);c.fillStyle=col;c.beginPath();c.moveTo(0,10);
  c.bezierCurveTo(-26,-8,-14,-30,0,-16);c.bezierCurveTo(14,-30,26,-8,0,10);c.fill();c.restore()}
function hearts(t,mx,my){
  if(t<3.5||t>7.2)return;
  for(let i=0;i<10;i++){const life=1.6,st=3.5+i*.35;const p=(t-st)/life;if(p<0||p>1)continue;
    c.globalAlpha=Math.sin(p*Math.PI);heart(mx-60+Math.sin(p*6+i)*30+hash(i)*120,my-120-p*300,1.2+hash(i+2),i%2?K.pink:'#ff9fc0');c.globalAlpha=1}
}
function confetti(t){
  const d=t-7.9; if(d<0)return;
  const cols=['#ff6fa3','#ffbf2e','#33c4b0','#55a8ff','#a27bff','#ff8a3d'];
  for(let i=0;i<160;i++){
    const x0=hash(i)*W,vy=260+hash(i+1)*380,y=-40-hash(i+2)*500+d*vy,x=x0+Math.sin(d*3+i)*50;
    if(y>H+40)continue;const r=d*(4+hash(i+3)*6)+i;
    c.save();c.translate(x,y);c.rotate(r);c.scale(1,Math.abs(Math.cos(r*1.3))+.2);c.fillStyle=cols[i%6];
    i%3?c.fillRect(-10,-6,20,12):(c.beginPath(),c.arc(0,0,8,0,Math.PI*2),c.fill());c.restore();
  }
}
function burst(t){
  const a=t<8?0:eOut(seg(t,8,8.4)); if(a<=0)return;
  c.save();c.translate(W/2,TY);c.rotate(t*.3);c.globalAlpha=.55*a;
  for(let i=0;i<16;i++){c.fillStyle=i%2?'#fff6c9':'#ffe0ef';c.beginPath();c.moveTo(0,0);c.arc(0,0,1400*a,i/16*Math.PI*2,(i+1)/16*Math.PI*2);c.closePath();c.fill()}
  c.restore();
}

// ---------- title stickers
function sticker(ch,col,size){
  c.font=`${size}px Pop`;c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';
  c.save();c.shadowColor='rgba(90,74,122,.28)';c.shadowOffsetY=14;c.shadowBlur=6;
  c.strokeStyle='#fff';c.lineWidth=size*.2;c.strokeText(ch,0,0);c.restore();
  c.strokeStyle='#fff';c.lineWidth=size*.2;c.strokeText(ch,0,0);
  c.fillStyle=col;c.fillText(ch,0,0);
  c.save();c.beginPath();c.rect(-size,-size,size*2,size*.78);c.clip();c.globalAlpha=.28;c.fillStyle='#fff';c.fillText(ch,0,0);c.restore();
}
function title(t){
  if(!LX)layout();
  const bp=beatPulse(t);
  LET.forEach((l,i)=>{
    let st=l.t; const re=t>=8?8+i*.05:null;
    const p=seg(t,st,st+.6); if(p<=0)return;
    let s=elastic(p), y=TY-(1-eOut(seg(t,st,st+.25)))*120, r=0;
    if(re!==null){const q=seg(t,re,re+.6);s*=lerp(.6,1,elastic(q))}
    if(p>=1){r=Math.sin(t*3.6+i*1.1)*.05;y+=Math.sin(t*3.2+i*.8)*8;s*=1+.05*bp}
    c.save();c.translate(LX[i],y);c.rotate(r);c.scale(s*(1+.08*Math.sin(p*20)*(1-p)),s*(1-.08*Math.sin(p*20)*(1-p)));
    sticker(l.ch,l.col,TS);c.restore();
  });
}
function topLabel(t){
  const p=seg(t,3.6,4.1); if(p<=0)return;
  c.save();c.translate(W/2,TY-175);c.scale(elastic(p),elastic(p));
  c.font='600 52px Fred';c.textAlign='center';c.textBaseline='middle';if('letterSpacing' in c)c.letterSpacing='10px';
  c.lineJoin='round';c.strokeStyle='#fff';c.lineWidth=14;c.strokeText('HASSEI NEWS ♪',0,0);c.fillStyle=K.ink;c.fillText('HASSEI NEWS ♪',0,0);
  if('letterSpacing' in c)c.letterSpacing='0px';c.restore();
}
function subPill(t){
  const p=seg(t,3.8,4.4); if(p<=0)return;
  const s='やわたはま・にしうわのニュースだよ♪';
  c.save();c.translate(W/2,TY+175+Math.sin(t*3)*4);c.scale(elastic(p),elastic(p));
  c.font='700 46px Maru';const w=c.measureText(s).width+90,h=88;
  c.fillStyle='rgba(90,74,122,.18)';c.beginPath();c.roundRect(-w/2,-h/2+8,w,h,h/2);c.fill();
  c.fillStyle='#fff';c.beginPath();c.roundRect(-w/2,-h/2,w,h,h/2);c.fill();
  c.fillStyle=K.ink;c.textAlign='center';c.textBaseline='middle';c.fillText(s,0,2);
  c.fillStyle='#ffbf2e';star4(-w/2+10,-h/2+6,18,'#ffbf2e');star4(w/2-14,h/2-4,14,K.pink);
  c.restore();
}
function bubble(t,mx,my){
  const p=seg(t,4.6,5.0)*(1-seg(t,6.6,6.9)); if(p<=0)return;
  c.save();c.translate(mx+150,my-210);const s=elastic(seg(t,4.6,5.1))*(t>6.6?1-seg(t,6.6,6.9):1);c.scale(s,s);
  c.fillStyle='#fff';c.beginPath();c.roundRect(-130,-55,260,110,55);c.fill();
  c.beginPath();c.moveTo(-70,40);c.lineTo(-130,95);c.lineTo(-30,50);c.fill();
  c.font='700 50px Maru';c.fillStyle=K.pink;c.textAlign='center';c.textBaseline='middle';c.fillText('みてね！',0,2);
  c.restore();
}

// ---------- the mikan mascot
function mascotState(t){
  const G1=600,G2=820,G3=850;
  let x=960,y=1400,rot=0,land=[];
  const hop=(tt,per,h)=>{const ph=((tt%per)+per)%per/per;return -h*4*ph*(1-ph)};
  if(t<1.2){y=1400}
  else if(t<1.65){const p=seg(t,1.2,1.65);y=lerp(1400,G1,p)-Math.sin(p*Math.PI)*260;}
  else if(t<2.0){y=G1+hop(t-1.65,.35,40)}
  else if(t<2.6){const p=eIO(seg(t,2.0,2.6));x=lerp(960,1580,p);y=lerp(G1,G2,p)-Math.sin(p*Math.PI)*300;rot=p*Math.PI*2}
  else if(t<7.0){x=1580;y=G2+hop(t-2.6,.5,26)}
  else if(t<7.6){const p=seg(t,7.0,7.6);x=1580;y=G2-Math.sin(p*Math.PI)*320;rot=-eIO(p)*Math.PI*2}
  else if(t<8.0){const p=eIO(seg(t,7.6,8.0));x=lerp(1580,960,p);y=lerp(G2,G3,p)-Math.sin(p*Math.PI)*220}
  else {x=960;y=G3+hop(t-8,.5,22)}
  // squash on each landing
  const lands=[1.65,2.0,2.6,7.0,7.6,8.0];for(let k=2.6;k<7;k+=.5)lands.push(k);for(let k=8;k<10;k+=.5)lands.push(k);
  let s=0;for(const L of lands){const d=t-L;if(d>=0&&d<.35)s+=.22*Math.exp(-d*11)*Math.cos(d*26)}
  const ground=t<2?G1:t<7.8?G2:G3;
  return {x,y,rot,sx:1+s,sy:1-s,ground};
}
function mascot(t){
  const m=mascotState(t); if(m.y>1300)return m;
  const R=118;
  // shadow
  const lift=cl((m.ground-m.y)/320);
  c.fillStyle=`rgba(60,80,120,${.22*(1-lift*.7)})`;c.beginPath();c.ellipse(m.x,m.ground+R*.95,R*(1-lift*.4),R*.22*(1-lift*.4),0,0,Math.PI*2);c.fill();
  c.save();c.translate(m.x,m.y+R*.95);c.scale(m.sx,m.sy);c.translate(0,-R*.95);c.rotate(m.rot);
  // arms
  const wave=t>4.5&&t<7?Math.sin(t*14)*.5:Math.sin(t*5)*.15;
  c.strokeStyle=K.brown;c.lineWidth=12;c.lineCap='round';
  c.beginPath();c.moveTo(-R*.95,R*.15);c.lineTo(-R*1.3,R*.05);c.stroke();
  c.save();c.translate(R*.92,R*.05);c.rotate(-.9+wave);c.beginPath();c.moveTo(0,0);c.lineTo(R*.42,0);c.stroke();c.restore();
  // body
  const g=c.createRadialGradient(-R*.35,-R*.4,10,0,0,R*1.1);g.addColorStop(0,'#ffc36b');g.addColorStop(.6,K.mikan);g.addColorStop(1,K.mikan2);
  c.fillStyle=g;c.strokeStyle=K.brown;c.lineWidth=8;
  c.beginPath();c.ellipse(0,0,R*1.04,R*.96,0,0,Math.PI*2);c.fill();c.stroke();
  c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.ellipse(-R*.48,-R*.5,R*.2,R*.12,-.6,0,Math.PI*2);c.fill();
  c.fillStyle='rgba(200,90,10,.25)';for(let i=0;i<9;i++){c.beginPath();c.arc(Math.cos(i*2.4)*R*.7,Math.sin(i*2.4)*R*.6+R*.15,3,0,Math.PI*2);c.fill()}
  // leaf + stem
  c.strokeStyle=K.brown;c.lineWidth=7;c.beginPath();c.moveTo(0,-R*.92);c.lineTo(4,-R*1.12);c.stroke();
  c.save();c.translate(8,-R*1.08);c.rotate(-.5+Math.sin(t*4)*.15);c.fillStyle=K.leaf;c.strokeStyle='#3d8f48';c.lineWidth=5;
  c.beginPath();c.ellipse(34,0,38,18,0,0,Math.PI*2);c.fill();c.stroke();c.beginPath();c.moveTo(0,0);c.lineTo(64,0);c.stroke();c.restore();
  // face
  const blink=[1.9,4.1,5.9,9.2].some(b=>t>b&&t<b+.12), wink=t>8.6&&t<9.1;
  c.fillStyle='#3b2a3f';c.strokeStyle='#3b2a3f';c.lineWidth=7;
  [[-1,blink],[1,blink||wink]].forEach(([sd,closed])=>{const ex=sd*R*.36,ey=-R*.08;
    if(closed){c.beginPath();c.arc(ex,ey+4,16,Math.PI*1.1,Math.PI*1.9);c.stroke()}
    else{c.beginPath();c.ellipse(ex,ey,14,19,0,0,Math.PI*2);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(ex+5,ey-7,6,0,Math.PI*2);c.fill();c.beginPath();c.arc(ex-4,ey+6,3,0,Math.PI*2);c.fill();c.fillStyle='#3b2a3f'}});
  c.fillStyle=K.blush;c.globalAlpha=.8;c.beginPath();c.ellipse(-R*.6,R*.22,22,13,0,0,Math.PI*2);c.ellipse(R*.6,R*.22,22,13,0,0,Math.PI*2);c.fill();c.globalAlpha=1;
  const open=t>2&&t<2.6||t>7&&t<8.2;
  c.fillStyle='#b8323f';c.beginPath();if(open){c.ellipse(0,R*.24,22,26,0,0,Math.PI*2)}else{c.arc(0,R*.15,22,0,Math.PI)}c.fill();
  c.fillStyle='#ff8fa8';c.beginPath();c.ellipse(0,R*(open?.36:.27),12,7,0,0,Math.PI*2);c.fill();
  c.restore();
  return m;
}

function render(t){
  c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';
  sky(t);clouds(t);sparkles(t);
  burst(t);
  hills(t);
  sea(t);
  fish(t,4.4,1000,K.pink);fish(t,5.9,1180,'#ffbf2e');
  const m=mascotState(t);
  hearts(t,m.x,m.y);
  topLabel(t);
  title(t);
  subPill(t);
  mascot(t);
  bubble(t,m.x,m.y);
  confetti(t);
  // pastel flash on each pop
  let f=0;for(const l of LET)if(t>=l.t)f=Math.max(f,.25*Math.exp(-(t-l.t)*14));if(t>=8)f=Math.max(f,.6*Math.exp(-(t-8)*7));
  if(f>0){c.fillStyle=`rgba(255,255,255,${f})`;c.fillRect(0,0,W,H)}
  // fade in from white, iris out to pink around the mascot
  if(t<.35){c.fillStyle=`rgba(255,255,255,${1-t/.35})`;c.fillRect(0,0,W,H)}
  const ir=seg(t,9.35,9.95);
  if(ir>0){const r=lerp(2300,0,eIO(ir));c.save();c.fillStyle='#ffd3e6';c.beginPath();c.rect(0,0,W,H);c.arc(m.x,m.y,r,0,Math.PI*2,true);c.fill('evenodd');
    if(r>4){c.strokeStyle='#fff';c.lineWidth=14;c.beginPath();c.arc(m.x,m.y,r,0,Math.PI*2);c.stroke()}c.restore()}
}
window.__renderAt=render;
const au=document.getElementById('au'),btn=document.getElementById('play'),tc=document.getElementById('tc');
const REST=8.8;
function stamp(t){const f=Math.floor(t*29.97);tc.textContent=`00:00:${String(Math.floor(f/30)).padStart(2,'0')};${String(f%30).padStart(2,'0')}`}
let raf=0;
function loop(){const t=Math.min(au.currentTime,DUR);render(t);stamp(t);if(!au.paused&&!au.ended)raf=requestAnimationFrame(loop);else btn.textContent='▶ 再生（音あり）'}
btn.onclick=()=>{if(au.paused){if(au.ended)au.currentTime=0;au.play().then(()=>{btn.textContent='❚❚ 一時停止';cancelAnimationFrame(raf);loop()}).catch(()=>{})}else au.pause()};
document.getElementById('replay').onclick=()=>{au.currentTime=0;if(au.paused)btn.click()};
Promise.all(['200px Pop','700 46px Maru','600 52px Fred'].map(f=>document.fonts.load(f))).then(()=>{layout();render(REST);stamp(REST);window.__ready=true});
</script>
